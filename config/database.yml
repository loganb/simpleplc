default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV["PGHOST"] %>
  port: <%= ENV["PGPORT"] %>
  username: <%= ENV["PGUSER"] %>
  password: <%= ENV["PGPASSWORD"] %>

development:
  <<: *default
  database: <%= ENV.fetch("PLC_CONTROLLER_DATABASE", "plc_controller_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("PLC_CONTROLLER_TEST_DATABASE", "plc_controller_test") %>

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("PLC_CONTROLLER_DATABASE", "plc_controller_production") %>
  cache:
    <<: *default
    database: <%= ENV.fetch("PLC_CONTROLLER_CACHE_DATABASE", "plc_controller_production_cache") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("PLC_CONTROLLER_QUEUE_DATABASE", "plc_controller_production_queue") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("PLC_CONTROLLER_CABLE_DATABASE", "plc_controller_production_cable") %>
    migrations_paths: db/cable_migrate
